services:
  postgres:
    image: postgres:latest
    container_name: cat-document-db
    ports:
      - "5432:5432"
    volumes:
      - ./psqlScripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=iot_cat_tracker_db
      - PGDATA=/var/lib/postgresql/data/db
    networks:
      - backend

  mongodb:
    image: mongo:latest
    container_name: raspberrypi-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongodb
      - MONGO_INITDB_ROOT_PASSWORD=mongodb
      - MONGO_INITDB_DATABASE=raspberrypi_db
    command: ["mongod", "--auth"]

networks:
  backend: {}